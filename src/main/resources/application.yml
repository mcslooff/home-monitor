server:
  port: 8180

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  flyway:
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never

mqtt:
  broker:
    host: 0.0.0.0
    port: 1883
  topic: sensors/demo/measur
  client-id: ${MQTT_CLIENT_ID:unconfigured:v1}
  consumer:
    enabled: ${MQTT_CONSUMER_ENABLED:false}
  producer:
    enabled: ${MQTT_PRODUCER_ENABLED:false}
    topic: ${MQTT_PRODUCER_TOPIC:${mqtt.topic}}


camel:
  component:
    paho:
      broker-url: ${MQTT_BROKER_URL:tcp://127.0.0.1:${mqtt.broker.port}}
      automatic-reconnect: true
      mqtt-version: 4 # MQTT 3.1.1; no automatic downgrade to MQTT 3.1
      user-name: ${MQTT_USERNAME:}
      password: ${MQTT_PASSWORD:}
